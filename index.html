    <footer>
      <h3>ℹ️ About this tool</h3>
      <p>
        Names and molar masses come from a curated list and the
        <a href="https://pubchem.ncbi.nlm.nih.gov" target="_blank" rel="noopener">PubChem</a>
        database (NIH).<br />
        Formulas are case-sensitive: <span>CO</span> is carbon monoxide,
        <span>Co</span> is cobalt.
      </p>
      <p>
        💡 <span>Tips:</span> use capitals correctly (NaCl, not nacl). Brackets work, e.g. Ca(OH)<sub>2</sub>.
        Formulas with many isomers show the first 8 results.
      </p>
